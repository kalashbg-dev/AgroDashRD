# AgroDashRD with PostgreSQL. Set POSTGRES_PASSWORD in .env first (letters and digits:
# it also goes inside the database URL).
#   docker compose up -d                        database, migrations and web app
#   docker compose run --rm weekly              load the Drive reports and forecast
#   docker compose run --rm web create-admin --email you@example.com --superadmin
# Only `db` runs during development (`docker compose up -d db`).
x-app: &app
  build: .
  image: agrodash:latest
  environment:
    AGRODASH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agrodash}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-agrodash}
    AGRODASH_DRIVE_FILE_IDS: ${AGRODASH_DRIVE_FILE_IDS:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrodash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agrodash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Reachable only from this machine (for migrations and tests), never from the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Published on this machine only; put a reverse proxy with HTTPS in front of it.
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3

  # Weekly job: run it from cron or the host's scheduler, e.g. Mondays at 06:00:
  #   0 6 * * 1  cd /srv/agrodash && docker compose run --rm weekly
  weekly:
    <<: *app
    entrypoint: ["sh", "-c"]
    command: ["agrodash ingest --drive && agrodash forecast"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]

volumes:
  postgres_data:
