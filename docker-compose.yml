services:
  # Servicio de Base de Datos (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: agrodash-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrodash_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-agrodash_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agrodash-network

  # Servicio Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrodash-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrodash_user}:${POSTGRES_PASSWORD:-secure_password_2026}@db:5432/${POSTGRES_DB:-agrodash_db}
      SECRET_KEY: ${SECRET_KEY:-your_secret_key_change_me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    networks:
      - agrodash-network
    # Comando para ejecutar migraciones y luego iniciar la app (opcional, si se usa alembic)
    # command: sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:

networks:
  agrodash-network:
    driver: bridge
